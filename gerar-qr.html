<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerar QR Code</title><style>body{font-family:Arial;background:#f4ead4;padding:30px;text-align:center;color:#3b2417}.box{max-width:600px;margin:auto;background:white;padding:25px;border-radius:15px}input{width:90%;padding:13px;margin:12px 0;border:1px solid #bbb;border-radius:8px}button{padding:12px 18px;border:0;border-radius:8px;background:#5b321f;color:#fff;font-weight:bold}img{margin:20px auto;max-width:280px}</style></head><body><div class="box"><h1>QR Code do site</h1><p>Cole aqui o endereço público do seu site:</p><input id="url" placeholder="https://..."><br><button onclick="gerar()">Gerar QR Code</button><div id="out"></div></div><script>function gerar(){const u=document.getElementById('url').value.trim();if(!u)return;document.getElementById('out').innerHTML='<img alt="QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(u)+'"><p>Salve/imprima este QR Code no trabalho.</p>'}</script></body></html>
